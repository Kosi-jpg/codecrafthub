<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub — Course Management Dashboard</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #dbeafe;
    --accent: #0ea5e9;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --error: #dc2626;
    --error-light: #fee2e2;
    --neutral-900: #0f172a;
    --neutral-800: #1e293b;
    --neutral-700: #334155;
    --neutral-600: #475569;
    --neutral-500: #64748b;
    --neutral-400: #94a3b8;
    --neutral-300: #cbd5e1;
    --neutral-200: #e2e8f0;
    --neutral-100: #f1f5f9;
    --neutral-50: #f8fafc;
    --bg: #f1f5f9;
    --sidebar-bg: #0f172a;
    --sidebar-text: #cbd5e1;
    --sidebar-active: #2563eb;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
    --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* Reset */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    width: 100%;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--neutral-800);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  input, select, textarea {
    font-family: inherit;
  }

  /* Main layout */
  .app {
    display: grid;
    grid-template-columns: 256px minmax(0, 1fr);
    min-height: 100vh;
    width: 100%;
  }

  .sidebar-backdrop {
  display: none;
}

  /* Sidebar */
  .sidebar {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    min-width: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    flex-shrink: 0;
  }

  .brand-name {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--neutral-400);
  }

  .nav-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--neutral-500);
    padding: 12px 12px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    color: var(--sidebar-text);
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.06);
    color: #fff;
  }

  .nav-item.active {
    background: var(--sidebar-active);
    color: #fff;
  }

  .nav-item svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px;
    font-size: 12px;
    color: var(--neutral-500);
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* Main content */
  .main {
    width: 100%;
    min-width: 0;
    max-width: none;
    margin: 0;
    padding: clamp(24px, 3vw, 56px);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .topbar h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--neutral-900);
    letter-spacing: -0.5px;
  }

  .topbar p {
    color: var(--neutral-500);
    font-size: 14px;
    margin-top: 2px;
  }

  .menu-toggle {
    display: none;
    background: #fff;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-sm);
    width: 40px;
    height: 40px;
    align-items: center;
    justify-content: center;
  }

  /* Stat cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
    gap: 16px;
    margin-bottom: 28px;
    min-width: 0;
  }

  .stat-card {
    background: #fff;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    min-width: 0;
  }

  .stat-card:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .stat-card .stat-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    margin-bottom: 14px;
  }

  .stat-card .stat-icon svg {
    width: 22px;
    height: 22px;
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: var(--neutral-500);
    font-weight: 500;
  }

  .stat-card .stat-value {
    font-size: 30px;
    font-weight: 700;
    color: var(--neutral-900);
    margin-top: 2px;
  }

  .stat-card.total .stat-icon {
    background: var(--primary-light);
    color: var(--primary);
  }

  .stat-card.notstarted .stat-icon {
    background: var(--neutral-100);
    color: var(--neutral-600);
  }

  .stat-card.progress .stat-icon {
    background: var(--warning-light);
    color: var(--warning);
  }

  .stat-card.completed .stat-icon {
    background: var(--success-light);
    color: var(--success);
  }

  .stat-card::after {
    content: '';
    position: absolute;
    right: -20px;
    top: -20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.04;
  }

  /* Toolbar and panel */
  .panel {
    background: #fff;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    width: 100%;
    min-width: 0;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--neutral-200);
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 220px;
  }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--neutral-400);
  }

  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 40px;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--neutral-50);
    transition: var(--transition);
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  .filter-select {
    padding: 10px 12px;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--neutral-50);
    color: var(--neutral-700);
    transition: var(--transition);
    cursor: pointer;
  }

  .filter-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    border: none;
    transition: var(--transition);
    white-space: nowrap;
  }

  .btn svg {
    width: 16px;
    height: 16px;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }

  .btn-secondary {
    background: var(--neutral-100);
    color: var(--neutral-700);
  }

  .btn-secondary:hover {
    background: var(--neutral-200);
  }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  .btn-danger:hover {
    background: #b91c1c;
  }

  .btn-ghost {
    background: transparent;
    color: var(--neutral-600);
    padding: 8px;
  }

  .btn-ghost:hover {
    background: var(--neutral-100);
    color: var(--neutral-900);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    text-align: left;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--neutral-500);
    background: var(--neutral-50);
    border-bottom: 1px solid var(--neutral-200);
    white-space: nowrap;
  }

  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--neutral-100);
    color: var(--neutral-700);
    vertical-align: top;
  }

  tbody tr {
    transition: var(--transition);
  }

  tbody tr:hover {
    background: var(--neutral-50);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .course-name {
    font-weight: 600;
    color: var(--neutral-900);
  }

  .course-desc {
    color: var(--neutral-500);
    font-size: 13px;
    margin-top: 2px;
    max-width: 360px;
  }

  .course-date {
    color: var(--neutral-500);
    font-size: 13px;
    white-space: nowrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge.not-started {
    background: var(--neutral-100);
    color: var(--neutral-600);
  }

  .badge.in-progress {
    background: var(--warning-light);
    color: var(--warning);
  }

  .badge.completed {
    background: var(--success-light);
    color: var(--success);
  }

  .row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }

  /* Empty, loading and error states */
  .state-row td {
    text-align: center;
    padding: 48px 16px;
    color: var(--neutral-500);
  }

  .state-row .state-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--neutral-100);
    color: var(--neutral-400);
    display: grid;
    place-items: center;
    margin: 0 auto 12px;
  }

  .state-row .state-icon svg {
    width: 24px;
    height: 24px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--neutral-200);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .alert {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .alert-error {
    background: var(--error-light);
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  .alert-success {
    background: var(--success-light);
    color: #166534;
    border: 1px solid #bbf7d0;
  }

  .alert svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .alert button {
    margin-left: auto;
    background: transparent;
    border: none;
    color: inherit;
    opacity: 0.6;
  }

  .alert button:hover {
    opacity: 1;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    backdrop-filter: blur(2px);
  }

  .modal-overlay.open {
    display: flex;
    animation: fadeIn 180ms ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: #fff;
    border-radius: var(--radius);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 220ms cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes slideUp {
    from {
      transform: translateY(24px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--neutral-200);
  }

  .modal-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--neutral-900);
  }

  .modal-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--neutral-200);
    background: var(--neutral-50);
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--neutral-700);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #fff;
    color: var(--neutral-800);
    transition: var(--transition);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  .form-error {
    font-size: 12px;
    color: var(--error);
    margin-top: 4px;
  }

  /* Tablet and mobile */
@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 50;
    width: 256px;
    height: 100vh;
    transform: translateX(-100%);
    transition: transform var(--transition);
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-lg);
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    z-index: 40;
    display: none;
  }

  .sidebar-backdrop.open {
    display: block;
  }

  .menu-toggle {
    display: inline-flex;
    position: relative;
    z-index: 60;
  }

  .main {
    padding: 24px 20px;
  }

  .topbar h1 {
    font-size: 22px;
  }
}

@media (max-width: 560px) {
  .main {
    padding: 20px 16px;
  }

  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .search-box {
    min-width: 0;
  }

  .filter-select {
    width: 100%;
  }

  .btn {
    width: 100%;
    justify-content: center;
  }

  .modal-footer .btn {
    width: auto;
  }
}
</style>

<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">C</div>
        <div>
          <div class="brand-name">CodeCraftHub</div>
          <div class="brand-sub">Course Manager</div>
        </div>
      </div>
      <div class="nav-label">Menu</div>
      <button class="nav-item active" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" type="button" id="nav-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add Course
      </button>
      <div class="nav-label">Status</div>
      <button class="nav-item" type="button" data-filter="All">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        All Courses
      </button>
      <button class="nav-item" type="button" data-filter="Not Started">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
        Not Started
      </button>
      <button class="nav-item" type="button" data-filter="In Progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        In Progress
      </button>
      <button class="nav-item" type="button" data-filter="Completed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
        Completed
      </button>
      <div class="sidebar-footer">v1.0 · Connected to localhost:5001</div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1>Course Dashboard</h1>
            <p>Track and manage your learning courses</p>
          </div>
        </div>
        <button class="btn btn-primary" id="btn-add-top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Course
        </button>
      </div>

      <div id="alert-container"></div>

      <!-- Stat cards -->
      <div class="stats" id="stats"></div>

      <!-- Course table panel -->
      <div class="panel">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search by name or description..." />
          </div>
          <select class="filter-select" id="filter-select">
            <option value="All">All statuses</option>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Status</th>
                <th>Target Date</th>
                <th>Created</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="course-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-title">Add Course</h2>
        <button class="btn-ghost" id="modal-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="course-form" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="f-name">Course Name</label>
            <input type="text" id="f-name" required maxlength="120" placeholder="e.g. Intro to JavaScript" />
            <div class="form-error" id="err-name"></div>
          </div>
          <div class="form-group">
            <label for="f-desc">Description</label>
            <textarea id="f-desc" maxlength="500" placeholder="What will this course cover?"></textarea>
          </div>
          <div class="form-group">
            <label for="f-date">Target Date</label>
            <input type="date" id="f-date" />
          </div>
          <div class="form-group">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save">Save Course</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---------- Configuration ----------
      const API_BASE = "http://localhost:5001/api/courses";
      const STATUSES = ["Not Started", "In Progress", "Completed"];

      // ---------- State ----------
      let courses = [];
      let editingId = null;
      let searchTerm = "";
      let statusFilter = "All";

      // ---------- DOM helpers ----------
      const $ = (id) => document.getElementById(id);
      const tbody = $("course-tbody");
      const statsEl = $("stats");
      const alertContainer = $("alert-container");
      const modalOverlay = $("modal-overlay");

      // ---------- API layer ----------
      async function apiRequest(method, path, body) {
        const options = {
          method,
          headers: { "Content-Type": "application/json" },
        };
        if (body) options.body = JSON.stringify(body);

        const response = await fetch(API_BASE + path, options);

        if (!response.ok) {
          let message = "Request failed (status " + response.status + ").";
          try {
            const data = await response.json();
            if (data && (data.error || data.message)) {
              message = data.error || data.message;
            }
          } catch (_) { /* keep default message */ }
          throw new Error(message);
        }

        // Some DELETE endpoints return no body
        if (response.status === 204) return null;
        const text = await response.text();
        return text ? JSON.parse(text) : null;
      }

      async function fetchCourses() {
        showLoading();
        try {
          const data = await apiRequest("GET", "");
          courses = Array.isArray(data) ? data : (data && data.courses ? data.courses : []);
          renderAll();
        } catch (err) {
          showError("Could not load courses from the backend. " + friendlyError(err));
          courses = [];
          renderAll();
        }
      }

      async function createCourse(payload) {
        await apiRequest("POST", "", payload);
        await fetchCourses();
        showAlert("Course added successfully.", "success");
      }

      async function updateCourse(id, payload) {
        await apiRequest("PUT", "/" + encodeURIComponent(id), payload);
        await fetchCourses();
        showAlert("Course updated successfully.", "success");
      }

      async function deleteCourse(id) {
        await apiRequest("DELETE", "/" + encodeURIComponent(id));
        await fetchCourses();
        showAlert("Course deleted.", "success");
      }

      // ---------- Error helpers ----------
      function friendlyError(err) {
        const msg = (err && err.message) ? err.message : String(err);
        if (msg === "Failed to fetch" || /NetworkError|load failed/i.test(msg)) {
          return "The backend at " + API_BASE + " could not be reached. Make sure your Node.js server is running on port 5001.";
        }
        return msg;
      }

      // ---------- Alerts ----------
      function showAlert(message, type) {
        const el = document.createElement("div");
        el.className = "alert alert-" + (type === "success" ? "success" : "error");
        const icon = type === "success"
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        el.innerHTML = icon + "<span>" + escapeHtml(message) + "</span>" +
          '<button aria-label="Dismiss"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        alertContainer.appendChild(el);
        el.querySelector("button").addEventListener("click", () => el.remove());
        if (type === "success") setTimeout(() => el.remove(), 3500);
      }
      function showError(message) { showAlert(message, "error"); }

      // ---------- Escape ----------
      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      // ---------- Rendering ----------
      function statusClass(status) {
        if (status === "In Progress") return "in-progress";
        if (status === "Completed") return "completed";
        return "not-started";
      }

      function formatDate(value) {
        if (!value) return "—";
        const d = new Date(value);
        if (isNaN(d.getTime())) return escapeHtml(value);
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function renderStats() {
        const counts = { total: courses.length, "Not Started": 0, "In Progress": 0, "Completed": 0 };
        courses.forEach((c) => {
          const s = c.status;
          if (counts[s] != null) counts[s]++;
        });

        const cards = [
          { key: "total", label: "Total Courses", value: counts.total, icon: bookIcon() },
          { key: "notstarted", label: "Not Started", value: counts["Not Started"], icon: circleIcon() },
          { key: "progress", label: "In Progress", value: counts["In Progress"], icon: clockIcon() },
          { key: "completed", label: "Completed", value: counts["Completed"], icon: checkIcon() },
        ];

        statsEl.innerHTML = cards.map((c) =>
          '<div class="stat-card ' + c.key + '">' +
            '<div class="stat-icon">' + c.icon + '</div>' +
            '<div class="stat-label">' + c.label + '</div>' +
            '<div class="stat-value">' + c.value + '</div>' +
          '</div>'
        ).join("");
      }

      function getVisibleCourses() {
        const term = searchTerm.trim().toLowerCase();
        return courses.filter((c) => {
          const matchesStatus = statusFilter === "All" || c.status === statusFilter;
          const name = (c.name || "").toLowerCase();
          const desc = (c.description || "").toLowerCase();
          const matchesTerm = !term || name.indexOf(term) !== -1 || desc.indexOf(term) !== -1;
          return matchesStatus && matchesTerm;
        });
      }

      function renderTable() {
        const visible = getVisibleCourses();

        if (visible.length === 0) {
          tbody.innerHTML = emptyRow(courses.length === 0);
          return;
        }

        tbody.innerHTML = visible.map((c) =>
          '<tr>' +
            '<td>' +
              '<div class="course-name">' + escapeHtml(c.name) + '</div>' +
              (c.description ? '<div class="course-desc">' + escapeHtml(c.description) + '</div>' : '') +
            '</td>' +
            '<td><span class="badge ' + statusClass(c.status) + '">' + escapeHtml(c.status) + '</span></td>' +
            '<td class="course-date">' + formatDate(c.targetDate) + '</td>' +
            '<td class="course-date">' + formatDate(c.creationDate) + '</td>' +
            '<td>' +
              '<div class="row-actions">' +
                '<button class="btn-ghost" data-action="edit" data-id="' + escapeHtml(c.id) + '" title="Edit" aria-label="Edit">' + editIcon() + '</button>' +
                '<button class="btn-ghost" data-action="delete" data-id="' + escapeHtml(c.id) + '" title="Delete" aria-label="Delete">' + trashIcon() + '</button>' +
              '</div>' +
            '</td>' +
          '</tr>'
        ).join("");
      }

      function renderAll() {
        renderStats();
        renderTable();
      }

      function showLoading() {
        tbody.innerHTML =
          '<tr class="state-row"><td colspan="5">' +
            '<div class="spinner"></div>' +
            'Loading courses...' +
          '</td></tr>';
      }

      function emptyRow(noCoursesAtAll) {
        const msg = noCoursesAtAll
          ? "No courses yet. Click \"New Course\" to add your first one."
          : "No courses match your search or filter.";
        return '<tr class="state-row"><td colspan="5">' +
          '<div class="state-icon">' + emptyIcon() + '</div>' +
          escapeHtml(msg) +
        '</td></tr>';
      }

      // ---------- Modal ----------
      function openModal(course) {
        editingId = course ? course.id : null;
        $("modal-title").textContent = course ? "Edit Course" : "Add Course";
        $("modal-save").textContent = course ? "Update Course" : "Save Course";
        $("f-name").value = course ? (course.name || "") : "";
        $("f-desc").value = course ? (course.description || "") : "";
        $("f-date").value = toInputDate(course ? course.targetDate : "");
        $("f-status").value = course && STATUSES.indexOf(course.status) !== -1 ? course.status : "Not Started";
        $("err-name").textContent = "";
        modalOverlay.classList.add("open");
        setTimeout(() => $("f-name").focus(), 50);
      }

      function closeModal() {
        modalOverlay.classList.remove("open");
        editingId = null;
      }

      function toInputDate(value) {
        if (!value) return "";
        const d = new Date(value);
        if (isNaN(d.getTime())) return "";
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return yyyy + "-" + mm + "-" + dd;
      }

      function handleSubmit(e) {
        e.preventDefault();
        const name = $("f-name").value.trim();
        const description = $("f-desc").value.trim();
        const targetDate = $("f-date").value;
        const status = $("f-status").value;

        if (!name) {
          $("err-name").textContent = "Course name is required.";
          $("f-name").focus();
          return;
        }

        const payload = { name: name, description: description, targetDate: targetDate, status: status };

        if (editingId != null) {
          updateCourse(editingId, payload)
            .then(() => closeModal())
            .catch((err) => showError("Could not update course. " + friendlyError(err)));
        } else {
          createCourse(payload)
            .then(() => closeModal())
            .catch((err) => showError("Could not add course. " + friendlyError(err)));
        }
      }

      function handleDelete(id) {
        const course = courses.find((c) => String(c.id) === String(id));
        const label = course ? ("\"" + course.name + "\"") : "this course";
        if (!confirm("Delete " + label + "? This cannot be undone.")) return;
        deleteCourse(id).catch((err) =>
          showError("Could not delete course. " + friendlyError(err))
        );
      }

      // ---------- Event wiring ----------
      tbody.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        if (btn.dataset.action === "edit") {
          const course = courses.find((c) => String(c.id) === String(id));
          if (course) openModal(course);
        } else if (btn.dataset.action === "delete") {
          handleDelete(id);
        }
      });

      $("course-form").addEventListener("submit", handleSubmit);
      $("modal-close").addEventListener("click", closeModal);
      $("modal-cancel").addEventListener("click", closeModal);
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
      });

      $("btn-add-top").addEventListener("click", () => openModal(null));
      $("nav-add").addEventListener("click", () => { closeSidebar(); openModal(null); });

      $("search-input").addEventListener("input", (e) => {
        searchTerm = e.target.value;
        renderTable();
      });
      $("filter-select").addEventListener("change", (e) => {
        statusFilter = e.target.value;
        syncSidebarFilter();
        renderTable();
      });

      // Sidebar filter links
      document.querySelectorAll('[data-filter]').forEach((btn) => {
        btn.addEventListener("click", () => {
          statusFilter = btn.getAttribute("data-filter");
          $("filter-select").value = statusFilter;
          syncSidebarFilter();
          renderTable();
          closeSidebar();
        });
      });

      function syncSidebarFilter() {
        document.querySelectorAll('[data-filter]').forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-filter") === statusFilter);
        });
      }

    // Mobile sidebar toggle
const sidebar = $("sidebar");
const backdrop = $("sidebar-backdrop");

$("menu-toggle").addEventListener("click", () => {
  const isOpen = sidebar.classList.contains("open");

  if (isOpen) {
    closeSidebar();
  } else {
    sidebar.classList.add("open");
    backdrop.classList.add("open");
  }
});

backdrop.addEventListener("click", closeSidebar);

function closeSidebar() {
  sidebar.classList.remove("open");
  backdrop.classList.remove("open");
}

      // ---------- Icons (inline SVG) ----------
      function bookIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
      }
      function circleIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>';
      }
      function clockIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
      }
      function checkIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
      }
      function editIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
      }
      function trashIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      }
      function emptyIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      }

      // ---------- Init ----------
      fetchCourses();
    })();
  </script>
</body>
</html>
